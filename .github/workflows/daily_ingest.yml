name: Daily market ingest

on:
  schedule:
    # 9:00 AM Asia/Manila is 1:00 AM UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: item-market-signals

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      - name: Pull gpovalues snapshot
        run: python scripts/run_ingest_gpovalues.py

      - name: Parse tier reference
        run: python scripts/run_ingest_tier.py

      - name: Build feature matrix
        run: python scripts/run_feature_build.py

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/*.csv outputs/*.csv
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update daily market snapshots"
            git push
          fi
